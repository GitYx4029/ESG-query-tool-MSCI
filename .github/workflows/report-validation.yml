name: Validate report analysis

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - 'shared/**'
      - 'scripts/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/report-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --legacy-peer-deps
      - run: npm run check
      - run: npm test
      - run: node scripts/prepare-report-assets.mjs
      - run: npx vite build
